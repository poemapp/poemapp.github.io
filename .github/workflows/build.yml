name: Build Flet APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7' # Flet version နဲ့ ကိုက်ညီတဲ့ ဗားရှင်း
          channel: 'stable'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet
        
      - name: Build APK
        run: |
          pip install flet
          # License တွေကို အရင်လက်ခံမယ်
          yes | flutter doctor --android-licenses || true
          
          # Gradle ကို build လုပ်တဲ့အခါ error မတက်အောင် environment variable နဲ့ bypass လုပ်မယ်
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m"
          flet build apk
          
      - name: Find and Upload APK
        run: |
          # APK ဖိုင်ဘယ်နေရာမှာ ထွက်လာလဲဆိုတာ ရှာမယ်
          find . -name "*.apk"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          # path ကို ဒီအတိုင်း ပြောင်းလိုက်ပါ
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error